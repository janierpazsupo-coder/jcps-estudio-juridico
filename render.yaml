# JCPS — configuración opcional para usar la base PostgreSQL existente.
# No incluye contraseñas; Render resuelve el vínculo de manera segura.
services:
  - type: web
    name: jcps-estudio-juridico
    runtime: python
    plan: free
    region: virginia
    repo: https://github.com/janierpazsupo-coder/jcps-estudio-juridico
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JCPS_CONTACT_DATABASE_URL
        fromDatabase:
          name: jcps-consultas
          property: connectionString
